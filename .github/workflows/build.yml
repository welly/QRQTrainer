name: Build & Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  macos:
    # macos-15 for Xcode 16, which includes Swift Testing.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QRQ-Trainer
          path: dist/*
