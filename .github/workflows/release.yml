# Push a tag like v1.0.0 to build the app and publish a GitHub Release with the .dmg and .zip attached.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test
      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Package
        run: ./scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/QRQ-Trainer.dmg dist/QRQ-Trainer.zip \
            --title "QRQ Trainer ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
