# Publishes a GitHub Release with the .dmg and .zip attached, either by pushing a tag like v1.0.0,
# or from the Actions tab: Release → Run workflow → enter the version (the tag is created for you).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.2.3 (got $TAG)"; exit 1; }
      - name: Test core
        run: swift test
      - name: Build app bundle
        run: VERSION="${TAG#v}" ./scripts/build-app.sh
      - name: Package
        run: ./scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the tag at this commit if it doesn't exist yet.
          gh release create "$TAG" dist/QRQ-Trainer.dmg dist/QRQ-Trainer.zip \
            --target "$GITHUB_SHA" \
            --title "QRQ Trainer $TAG" \
            --notes-file .github/release-notes.md
