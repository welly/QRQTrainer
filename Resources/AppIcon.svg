<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#0a4fd6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="soft"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00226b" flood-opacity=".35"/></filter>
  </defs>
  <!-- macOS icon grid: 824×824 body centred on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <!-- speed ring -->
  <circle cx="512" cy="512" r="292" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="44"/>
  <path d="M512 220 A292 292 0 1 1 236.3 608" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
  <!-- Morse: dah dit dah dah  (Q) -->
  <g filter="url(#soft)" fill="#ffffff">
    <rect x="300" y="482" width="130" height="60" rx="30"/>
    <circle cx="482" cy="512" r="30"/>
    <rect x="544" y="482" width="130" height="60" rx="30"/>
    <rect x="300" y="482" width="0" height="0"/>
  </g>
  <g fill="#ffd34d" filter="url(#soft)">
    <rect x="696" y="482" width="40" height="60" rx="20" opacity="0"/>
  </g>
  <!-- speed chevrons -->
  <path d="M440 650 l40 32 -40 32" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M500 650 l40 32 -40 32" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
  <path d="M560 650 l40 32 -40 32" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".3"/>
</svg>
