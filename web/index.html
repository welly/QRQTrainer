<style>
  /* The same look as HW CPY and Mock QSO (hw_cpy/web): warm paper and amber, cards, a blurred bar, sheets for settings. */
  :root {

      --accent: #f0a634; --accent-ink: #1d1500; --soft: rgba(240, 166, 52, 0.14); --danger: #ff8a80;
      --good: #5fd07d; --bad: #ff7b72; --warn: #ffa24a; --gold: #f5c542;

      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16130e; --surface: #221e17; --surface-2: #2c271e; --text: #f3ede2; --muted: #a79d8b; --line: rgba(255, 240, 210, 0.10);

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 15px; white-space: nowrap; }
  .btn svg { width: 18px; height: 18px; }
  .btn:hover:not(:disabled) { filter: brightness(0.97); }

  .btn.danger { color: var(--danger); }
  .link-btn { border: 0; background: none; color: var(--accent); padding: 0; min-height: 36px; text-align: left; font-size: 15px; }

  @media (prefers-reduced-motion: reduce) { .wave.on i { animation: none; height: 16px; } }

    text-transform: uppercase; letter-spacing: 0.04em; }

  /* Results, history, insights */

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .class-head .acts { margin-left: auto; display: flex; gap: 14px; }
  /* Help and About, as in Mock QSO: one column of full-width cards, each point a row divided by a fine line */
  /* Shared by the G3AJM web apps (see Ham Tools/CLAUDE.md): the help and About area below the app starts after a clear break, 40px and a fine line. */
  .help { margin-top: 40px; padding-top: 8px; border-top: 1px solid var(--line); }
  .help.in-sheet { margin-top: 10px; padding-top: 0; border-top: 0; }
  .help .group { padding: 0 16px; margin-bottom: 4px; }
  .help h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 6px 8px; font-weight: 600; }
  .help ul { list-style: none; margin: 0; padding: 0; }
  .help p, .help li { font-size: 15px; color: var(--text); margin: 0; padding: 12px 0; line-height: 1.45; border-top: 1px solid var(--line); }
  .help li:first-child, .help p:first-child { border-top: 0; }
  .help strong { font-weight: 600; }
  footer.site { margin-top: 18px; color: var(--muted); font-size: 13px; text-align: center; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; z-index: 50; max-width: 90vw; }
</style>
</head>
<body>
<header class="bar">
  <span style="width:44px"></span>
  <h1><img src="icon.png" alt="" width="22" height="22">QRQ Trainer</h1>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
</header>
<main>
  <div class="seg tabs" role="tablist" id="tabs">
    <button role="tab" data-view="train" aria-selected="true">Train</button>
    <button role="tab" data-view="insights" aria-selected="false">Insights</button>
    <button role="tab" data-view="history" aria-selected="false">History</button>
  </div>
  <div id="view"><div class="empty">Loading…</div></div>
</main>

<dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
  <div class="body">
    <header class="bar"><span style="width:44px"></span><h2 id="settingsTitle">Settings</h2><button class="icon-btn done" data-close>Done</button></header>
    <div class="scroll" tabindex="-1" autofocus id="settingsForm"></div>
  </div>
</dialog>

<dialog class="sheet" id="characters" aria-labelledby="charactersTitle">
  <div class="body">
    <header class="bar"><span style="width:44px"></span><h2 id="charactersTitle">Characters</h2><button class="icon-btn done" data-close>Done</button></header>
    <div class="scroll" tabindex="-1" autofocus id="charactersForm"></div>
  </div>
</dialog>

<dialog class="sheet wide" id="attempt" aria-labelledby="attemptTitle">
  <div class="body">
    <header class="bar"><button class="icon-btn" id="deleteAttempt" style="color:var(--danger)">Delete</button><h2 id="attemptTitle">Attempt</h2><button class="icon-btn done" data-close>Done</button></header>
    <div class="scroll" tabindex="-1" autofocus id="attemptBody"></div>
  </div>
</dialog>

<!-- Help, below the Train screen, as in Mock QSO (mock_qso/web/index.html): titled cards, one point per row. -->
<template id="helpTemplate">
  <div>
    <h2>Copying</h2>
    <div class="group">
    <ul>
      <li>Each item is sent once at the current speed. Type what you heard and press <strong>Return</strong> (<strong>Go</strong> on a phone). Copy it right and the next one is faster; miss and it slows down. Choose <strong>Fixed</strong> to keep one speed.</li>
      <li><strong>Repeat</strong> plays it again, but that item then scores nothing.</li>
      <li>Points grow with the item’s length in Morse and the speed it was sent at. Each wrong character costs points, and so does a slow answer: 3% for every second after the sound ends, but a correct copy always keeps at least half.</li>
      <li class="desk">Keys: <kbd>⌘</kbd> <kbd>↩</kbd> start, <kbd>↩</kbd> answer, <kbd>F6</kbd> or <kbd>⌘</kbd> <kbd>R</kbd> repeat, <kbd>esc</kbd> end the attempt.</li>
    </ul>
    </div>
  </div>
  <div>
    <h2>Practising</h2>
    <div class="group">
    <ul>
      <li>Copy in your head: don’t write while listening. Hear the whole item, then type it.</li>
      <li>Start a little below the speed where Insights says your accuracy drops below half, or turn on Farnsworth spacing in Settings for more time between characters.</li>
      <li>Insights shows which characters you recognise instantly and which need work; <strong>Practise these</strong> sends groups of the ones that need work.</li>
      <li>50 items is the classic attempt length. Best scores are compared only between attempts of the same kind and length, named above your score tiles.</li>
    </ul>
    </div>
  </div>
</template>

<!-- About and the footer: below the help, and at the foot of Settings. -->
<template id="aboutTemplate">
  <div>
    <h2>About</h2>
    <div class="group">
    <p>QRQ Trainer sends callsigns, codes, words or groups of characters one at a time at real speed, in the spirit of the classic RufzXP trainer (it isn’t connected to it).</p>
    <p>It all runs in your browser. Settings, history and any callsign list you import are kept on this device. History can be exported as CSV.</p>
    <p>Visits and the kinds of practice used are counted anonymously, without cookies (<a href="https://www.goatcounter.com/">GoatCounter</a>). What you type, your scores and your callsign lists are never sent.</p>
    <p>Works offline: after your first visit it opens without a connection. On a phone, add it to your Home Screen (in Safari, Share then Add to Home Screen) to open it like an app.</p>
    <p>No sound on an iPhone? Check the volume.</p>
    <p>There is also a <a href="https://g3ajm.radio/#qrq-trainer-mac">Mac app</a>. QRQ Trainer © 2026 Alastair Moore, G3AJM. Free software under the <a href="https://github.com/welly/QRQTrainer/blob/main/LICENSE">GNU General Public License, version 3 or later</a>, with no warranty.</p>
    </div>
  </div>
  <footer class="site">QRQ Trainer · <a href="https://g3ajm.radio/">G3AJM</a> · 73</footer>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
